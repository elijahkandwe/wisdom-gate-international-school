services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: digi_school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["5432:5432"]
  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digi_school
      JWT_SECRET: change-me-before-production
      CORS_ORIGIN: http://localhost:3000
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  pgdata:
