services:
  - type: web
    name: digi-school
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: digi-school-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: BANTUS
        generateValue: true
      - key: http://wisdomgateinternationalschool.com
        sync: false
      - key: SCHOOL_NAME
        value: Wisdom Gate International School
      - key: BANTUS
        sync: false

databases:
  - name: digi-school-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: digi_school
    user: digi_school
    storageAutoscalingEnabled: true
